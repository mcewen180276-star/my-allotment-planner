</style></head><body><header><h1>🌱 My Allotment Planner</h1><p>South West Scotland • Your growing year, organised</p></header><nav id="nav"></nav><main id="app"></main><dialog id="modal"><div id="modalbody"></div><div class="actions"><button class="secondary" onclick="closeModal()">Close</button></div></dialog><div id="toast" role="status"></div><script>
const TABS=[['home','🏡 Home'],['plants','🌿 Database'],['growing','🪴 My Growing'],['beds','▦ Beds'],['calendar','📅 Calendar'],['seeds','🌰 Seeds'],['diary','📓 Diary'],['harvest','🧺 Harvest'],['tasks','🔔 Tasks'],['settings','⚙️ Settings']];
const KEY='my-allotment-planner-v1';let seedPlants=[];let state={custom:[],growing:[],beds:[],diary:[],seeds:[],harvest:[],tasks:[],bedHistory:[],settings:{frostNote:'Outdoor dates are approximate. In South West Scotland, tender crops may need protection until late May or early June.'}};let tab='home',search='',category='All',viewDate=new Date(),calendarMode='month',calendarFilter='all',calendarSelected=new Date();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),dateISO=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10),today=()=>dateISO(new Date()),monthName=m=>new Date(2024,m-1,1).toLocaleString('en-GB',{month:'short'}),allPlants=()=>[...seedPlants,...state.custom],getPlant=id=>allPlants().find(x=>x.id===id),plantName=id=>{let p=getPlant(id);return p?`${p.name} — ${p.variety}`:'Unknown plant'},getBed=id=>state.beds.find(b=>b.id===id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Storage is full — export a backup now')}};
function toast(msg){let e=$('toast');e.textContent=msg;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',3500)}
function openModal(content){$('modalbody').innerHTML=content;$('modal').showModal()}function closeModal(){$('modal').close()}
function render(){ $('nav').innerHTML=TABS.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');let renderers={home:renderHome,plants:renderPlants,growing:renderGrowing,beds:renderBeds,calendar:renderCalendar,seeds:renderSeeds,diary:renderDiary,harvest:renderHarvest,tasks:renderTasks,settings:renderSettings};$('app').innerHTML=renderers[tab]();}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function addGrow(id){if(state.growing.some(g=>g.plantId===id)){toast('Already on your growing list');return}state.growing.push({id:uid(),plantId:id,status:'Planned',bedId:'',date:today(),notes:''});save();toast('Added to My Growing');render()}
function removeGrow(id){if(!confirm('Remove this plant from your growing list?'))return;state.growing=state.growing.filter(g=>g.id!==id);save();render()}
function renderHome(){let m=new Date().getMonth()+1,events=calendarEvents(m);return `<h2>Your allotment at a glance</h2><div class="grid">${[['🌿','Varieties in database',allPlants().length],['🪴','On your growing list',state.growing.length],['▦','Allotment beds',state.beds.length],['📅','Seasonal actions this month',events.length]].map(([i,n,v])=>`<div class="card"><div class="muted">${i} ${n}</div><div class="stat">${v}</div></div>`).join('')}</div><div class="card"><h3>This month: ${monthName(m)}</h3>${events.length?events.slice(0,12).map(e=>`<div class="list-item"><span class="tag">${esc(e.action)}</span> ${esc(e.name)}</div>`).join(''):'<p class="muted">Add plants to My Growing to populate your personal calendar.</p>'}<div class="actions"><button onclick="go('calendar')">View calendar</button><button class="secondary" onclick="go('plants')">Browse varieties</button></div></div><div class="note"><b>Local growing guidance:</b> ${esc(state.settings.frostNote)} Seed packets and local conditions take priority over general calendar dates.</div><div class="card"><h3>Getting started</h3><p>1. Find varieties in the database and add them to <b>My Growing</b>. 2. Create your beds. 3. Assign plants to beds. 4. Check the calendar and record your progress.</p></div>`}
function renderPlants(){let list=allPlants().filter(p=>(category==='All'||p.category===category)&&`${p.name} ${p.variety}`.toLowerCase().includes(search.toLowerCase()));return `<div class="row between"><h2>Plant & variety database</h2><button onclick="editPlant()">+ Add plant</button></div><div class="card"><div class="fields"><input aria-label="Search plants" placeholder="Search carrot, Nantes, lavender..." value="${esc(search)}" oninput="search=this.value;updatePlantList()"><select aria-label="Plant category" onchange="category=this.value;updatePlantList()">${['All','Vegetable','Fruit','Herb','Flower'].map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="internetSearch()">🔎 Search internet for a plant</button></div><p class="muted">Starter variety dates are broad UK estimates, not independently verified for each cultivar. Edit details to match your seed packets.</p></div><div id="plantlist">${plantCards(list)}</div>`}
function updatePlantList(){let list=allPlants().filter(p=>(category==='All'||p.category===category)&&`${p.name} ${p.variety}`.toLowerCase().includes(search.toLowerCase()));$('plantlist').innerHTML=plantCards(list)}
function plantCards(list){let groups={};for(let p of list){let key=p.category+'|'+p.name;if(!groups[key])groups[key]=[];groups[key].push(p)}return `<p class="muted">${list.length} varieties in ${Object.keys(groups).length} plant groups. Tap a plant name to show its varieties.</p>${Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([key,ps])=>`<details class="fold"><summary>${esc(ps[0].name)} <span class="tag">${esc(ps[0].category)}</span> <span class="muted">${ps.length} ${ps.length===1?'variety':'varieties'}</span></summary>${ps.map(p=>`<div class="list-item"><div class="row between"><b>${esc(p.variety)}</b><span class="muted">Sow outdoors: ${monthsText(p.outdoor)}</span></div><div class="actions"><button onclick="addGrow('${p.id}')">+ My Growing</button><button class="secondary" onclick="showPlant('${p.id}')">Details</button></div></div>`).join('')}</details>`).join('')||'<div class="card empty">No matching varieties.</div>'}`}

function monthsText(arr){return arr?.length?arr.map(monthName).join(', '):'—'}
function showPlant(id){let p=getPlant(id);if(!p)return;openModal(`<h2>${esc(p.name)} — ${esc(p.variety)}</h2><span class="tag">${esc(p.category)}</span><p><b>Sow indoors:</b> ${monthsText(p.indoor)}</p><p><b>Sow outdoors:</b> ${monthsText(p.outdoor)}</p><p><b>Plant/transplant:</b> ${monthsText(p.transplant)}</p><p><b>Harvest / flowering:</b> ${monthsText(p.harvest)}</p><p><b>Spacing:</b> ${esc(p.spacing)} cm · <b>Depth:</b> ${esc(p.depth)} cm</p><p><b>Light:</b> ${esc(p.sun)}</p><p><b>Soil:</b> ${esc(p.soil)}</p><p><b>Water:</b> ${esc(p.water)}</p><p><b>Feed:</b> ${esc(p.feed)}</p><p><b>Instructions:</b> ${esc(p.instructions)}</p><p><b>Suggested companions:</b> ${esc((p.companions||[]).join(', ')||'Not specified')}</p><p><b>Potential conflicts:</b> ${esc((p.avoid||[]).join(', ')||'Not specified')}</p><p class="muted">Source: ${esc(p.source)}</p><div class="actions"><button onclick="addGrow('${id}')">Add to My Growing</button><button class="secondary" onclick="editPlant('${id}')">${p.custom?'Edit plant':'Copy & customise'}</button></div>`)}
function monthChecks(field,values){return `<label>${field}</label><div class="months">${Array.from({length:12},(_,i)=>`<label><input type="checkbox" name="${field}" value="${i+1}" ${(values||[]).includes(i+1)?'checked':''}> ${monthName(i+1)}</label>`).join('')}</div>`}
function editPlant(id){let p=id?getPlant(id):null,copy=p&&!p.custom,orig=p||{name:'',variety:'',category:'Vegetable',indoor:[],outdoor:[],transplant:[],harvest:[],spacing:30,depth:2,sun:'Full sun',soil:'',water:'',feed:'',instructions:'',companions:[],avoid:[],source:'Manually added'};openModal(`<h2>${p?(copy?'Customise starter variety':'Edit plant'):'Add plant variety'}</h2><form id="plantform" onsubmit="savePlant(event,'${p&&!copy?p.id:''}')"><div class="fields"><label>Plant name<input name="name" required value="${esc(orig.name)}"></label><label>Variety<input name="variety" required value="${esc(orig.variety)}"></label><label>Category<select name="category">${['Vegetable','Fruit','Herb','Flower'].map(c=>`<option ${orig.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Spacing (cm)<input name="spacing" type="number" min="0" value="${esc(orig.spacing)}"></label><label>Seed depth (cm)<input name="depth" type="number" min="0" step="0.5" value="${esc(orig.depth)}"></label></div>${monthChecks('indoor',orig.indoor)}${monthChecks('outdoor',orig.outdoor)}${monthChecks('transplant',orig.transplant)}${monthChecks('harvest',orig.harvest)}${[['sun','Light'],['soil','Soil'],['water','Watering'],['feed','Feeding'],['instructions','Growing instructions'],['companions','Companion plants (comma separated)'],['avoid','Avoid nearby (comma separated)'],['source','Source / reference']].map(([key,label])=>`<label>${label}<textarea name="${key}">${esc(Array.isArray(orig[key])?orig[key].join(', '):orig[key])}</textarea></label>`).join('')}<div class="actions"><button type="submit">Save plant</button></div></form>`)}
function savePlant(e,id){e.preventDefault();let f=e.target,form=new FormData(f),p={id:id||uid(),custom:true};for(let k of ['name','variety','category','sun','soil','water','feed','instructions','source'])p[k]=String(form.get(k)||'').trim();for(let k of ['spacing','depth'])p[k]=Number(form.get(k))||0;for(let k of ['indoor','outdoor','transplant','harvest'])p[k]=form.getAll(k).map(Number);for(let k of ['companions','avoid'])p[k]=String(form.get(k)||'').split(',').map(x=>x.trim()).filter(Boolean);if(id)state.custom=state.custom.map(x=>x.id===id?p:x);else state.custom.push(p);save();closeModal();toast('Plant saved');render()}
async function internetSearch(){openModal(`<h2>Find a new variety online</h2><p>Search Wikipedia for background information, then review and complete the growing fields before saving. Wikipedia does not reliably provide cultivar-specific sowing calendars, so the app never invents them.</p><label>Plant or variety<input id="webquery" placeholder="e.g. Romanesco broccoli"></label><div class="actions"><button onclick="fetchWiki()">Search Wikipedia</button><button class="secondary" onclick="window.open('https://www.rhs.org.uk/plants/search-form','_blank','noopener')">RHS plant search</button></div><div id="webresults"></div>`)}
async function fetchWiki(){let q=$('webquery').value.trim();if(!q)return toast('Enter a plant name');$('webresults').innerHTML='<p>Searching...</p>';try{let u='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=5&prop=extracts&exintro=1&explaintext=1&exsentences=4&format=json&origin=*';let r=await fetch(u);if(!r.ok)throw Error('Search unavailable');let j=await r.json(),pages=Object.values(j.query?.pages||{});$('webresults').innerHTML=pages.length?pages.map(p=>`<div class="list-item"><b>${esc(p.title)}</b><p class="small">${esc((p.extract||'No summary available').slice(0,650))}</p><button onclick="importWiki(${p.pageid},'${encodeURIComponent(p.title)}')">Use this as a draft</button> <a target="_blank" rel="noopener" href="https://en.wikipedia.org/?curid=${p.pageid}">View source</a></div>`).join(''):'<p>No matches found. Try a different spelling or add manually.</p>'}catch(e){$('webresults').innerHTML='<p>Internet lookup is unavailable. You can still add a plant manually or search the RHS website.</p>'}}
async function importWiki(pageid,title){let t=decodeURIComponent(title);let url='https://en.wikipedia.org/?curid='+pageid;let desc='';try{let r=await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exsentences=5&pageids='+pageid+'&format=json&origin=*');let j=await r.json();desc=j.query?.pages?.[pageid]?.extract||''}catch(e){}closeModal();let bits=t.split(/\s+[—–-]\s+/),p={id:uid(),name:bits[0],variety:bits[1]||t,category:'Vegetable',indoor:[],outdoor:[],transplant:[],harvest:[],spacing:30,depth:2,sun:'',soil:'',water:'',feed:'',instructions:desc,companions:[],avoid:[],source:url,custom:true};state.custom.push(p);save();editPlant(p.id);toast('Draft imported. Review growing details before saving.')}
function renderGrowing(){return `<div class="row between"><h2>My Growing List</h2><button onclick="go('plants')">+ Choose varieties</button></div><p class="muted">Only plants in this list appear in your personal growing calendar. Tap a variety to expand its details.</p>${state.growing.length?state.growing.map(g=>`<details class="fold"><summary>${esc(plantName(g.plantId))} <span class="tag">${esc(g.status)}</span></summary><div class="fields"><label>Status<select onchange="updateGrow('${g.id}','status',this.value)">${['Planned','Sown indoors','Sown outdoors','Planted out','Growing','Harvesting','Finished'].map(x=>`<option ${g.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Bed<select onchange="updateGrow('${g.id}','bedId',this.value)"><option value="">Not assigned</option>${state.beds.map(b=>`<option value="${b.id}" ${g.bedId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label><label>Date<input type="date" value="${esc(g.date||today())}" onchange="updateGrow('${g.id}','date',this.value)"></label></div><label>Notes<input value="${esc(g.notes||'')}" onchange="updateGrow('${g.id}','notes',this.value)" placeholder="Sowing quantities, location, etc"></label><div class="actions"><button class="secondary" onclick="showPlant('${g.plantId}')">Growing guide</button><button class="danger" onclick="removeGrow('${g.id}')">Remove</button></div></details>`).join(''):'<div class="card empty">Your growing list is empty. Browse the database and add your chosen varieties.</div>'}`}

function updateGrow(id,key,val){let g=state.growing.find(x=>x.id===id);if(g){g[key]=val;save();if(key==='bedId')render()}}
function renderBeds(){return `<div class="row between"><h2>My allotment beds</h2><button onclick="editBed()">+ Create bed</button></div><p class="muted">Assign varieties in My Growing. Bed cards show current occupants, dimensions and recorded crop history.</p><div class="grid">${state.beds.map(b=>`<div class="card"><div class="row between"><h3>${esc(b.name)}</h3><button class="secondary" onclick="editBed('${b.id}')">Edit</button></div><p class="muted">${esc(b.length)}m × ${esc(b.width)}m · ${esc(b.notes||'')}</p><div class="bed">${state.growing.filter(g=>g.bedId===b.id).map(g=>`<span class="plant-chip">🌱 ${esc(plantName(g.plantId))}</span>`).join('')||'<span class="muted">No plants assigned</span>'}</div><p class="small"><b>History:</b> ${state.bedHistory.filter(h=>h.bedId===b.id).map(h=>`${esc(h.year)}: ${esc(h.crop)}`).join(' · ')||'Not recorded'}</p><div class="actions"><button class="secondary" onclick="addBedHistory('${b.id}')">+ Crop history</button></div></div>`).join('')}</div>${!state.beds.length?'<div class="card empty">No beds yet. Create your first bed to start planning.</div>':''}`}
function editBed(id){let b=id?getBed(id):{name:'',length:3,width:1.2,notes:''};openModal(`<h2>${id?'Edit':'Create'} bed</h2><form onsubmit="saveBed(event,'${id||''}')"><label>Bed name<input name="name" required value="${esc(b.name)}" placeholder="e.g. Raised Bed 1"></label><div class="fields"><label>Length (metres)<input name="length" type="number" min="0.1" step="0.1" value="${esc(b.length)}" required></label><label>Width (metres)<input name="width" type="number" min="0.1" step="0.1" value="${esc(b.width)}" required></label></div><label>Notes<textarea name="notes">${esc(b.notes)}</textarea></label><button type="submit">Save bed</button>${id?` <button type="button" class="danger" onclick="deleteBed('${id}')">Delete bed</button>`:''}</form>`)}
function saveBed(e,id){e.preventDefault();let f=new FormData(e.target),b={id:id||uid(),name:f.get('name'),length:Number(f.get('length')),width:Number(f.get('width')),notes:f.get('notes')};if(id)state.beds=state.beds.map(x=>x.id===id?b:x);else state.beds.push(b);save();closeModal();render()}

not send background notifications.</div>`}

function addRecord(key){let title={seeds:'Add seed packet',diary:'Add diary entry',harvest:'Record harvest',tasks:'Add reminder'}[key];openModal(`<h2>${title}</h2><form onsubmit="saveRecord(event,'${key}')"><label>${key==='seeds'?'Seed / variety':key==='tasks'?'Task':key==='harvest'?'Crop / variety':'Diary title'}<input name="title" required></label><label>${key==='seeds'?'Purchase / expiry reference date':'Date'}<input name="date" type="date" value="${today()}" required></label>${['seeds','harvest'].includes(key)?`<label>${key==='seeds'?'Quantity / packet details':'Quantity and unit'}<input name="amount" placeholder="e.g. 2 packets / 1.5 kg"></label>`:''}<label>Notes<textarea name="notes"></textarea></label><button type="submit">Save</button></form>`)}

function renderSettings(){return `<h2>Settings & backup</h2><div class="card"><h3>Local growing guidance</h3><label>Frost / climate note<textarea id="frostNote">${esc(state.settings.frostNote)}</textarea></label><button onclick="state.settings.frostNote=$('frostNote').value;save();toast('Saved')">Save note</button></div><div class="card"><h3>Protect your data</h3><p>Your beds, diary, plant additions and growing list are saved in this browser on this device. Clearing browser data or using another device may lose them unless you export a backup.</p><div class="actions"><button onclick="exportData()">⬇ Export JSON backup</button><label class="btn" style="margin:0">⬆ Restore backup<input type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></label></div></div><div class="card"><h3>Plant information</h3><p>${seedPlants.length} starter varieties plus ${state.custom.length} added/customised entries.</p><p class="muted">Starter sowing and harvest months are approximate UK reference windows, often shared between varieties of the same crop. Companion suggestions are traditional gardening associations and not guaranteed scientifically proven benefits. For reliable cultivar-specific advice, consult the seed packet and sources such as RHS.</p></div><div class="card"><h3>Install this app</h3><p>On Android Chrome, open the hosted app, tap the browser menu and choose <b>Add to Home screen</b> or <b>Install app</b>. Offline use works after the first successful online load.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'my-allotment-planner',version:1,exported:today(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='allotment-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

const oldRenderHome=renderHome,oldRenderBeds=renderBeds,oldRenderCalendar=renderCalendar,oldRenderSeeds=renderSeeds,oldRenderDiary=renderDiary,oldRenderHarvest=renderHarvest,oldRenderTasks=renderTasks,oldRenderSettings=renderSettings,oldRenderPlants=renderPlants,oldSave=save,oldInit=init;

function taskPlantItems(month){let out=[];let seen=new Set();for(const g of state.growing){const p=getPlant(g.plantId);if(!p)continue;for(const [k,verb] of ACTIONS){if(p[k]?.includes(month)){let key=`${g.id}:${k}`;if(!seen.has(key)){out.push({key,title:`${verb}: ${p.name} — ${p.variety}`});seen.add(key)}}}}return out}

renderSettings=function(){return oldRenderSettings()+`<div class="card"><h3>🛟 Recovery & data safety</h3><p class="muted">Your original data stays under the same local storage key. A rolling recovery snapshot is also saved locally after several edits. Neither local snapshots nor browser storage replace a downloaded backup.</p><div class="actions"><button onclick="snapshot();toast('Recovery snapshot saved')">Save recovery snapshot</button><button class="secondary" onclick="recoverSnapshot()">Restore latest snapshot</button></div></div><div class="card"><h3>🌦 Weather & frost risk</h3><p class="muted">Optional live forecast from Open-Meteo. Requires internet and a manually selected approximate location. Forecasts are estimates, not frost guarantees.</p><label>Location<select id="weatherLocation"><option value="55.07,-3.61">Dumfries</option><option value="54.94,-3.93">Castle Douglas</option><option value="54.99,-3.06">Annan</option><option value="55.78,-4.00">Lanark</option></select></label><button onclick="loadWeather()">Check 7-day forecast</button><div id="weatherResult">${weatherHtml()}</div></div>`};
function recoverSnapshot(){let snaps;try{snaps=JSON.parse(localStorage.getItem('my-allotment-v3-recovery')||'[]')}catch(e){snaps=[]}let s=snaps.at(-1);if(!s){toast('No recovery snapshot found');return}if(!confirm(`Restore snapshot from ${s.at}? Current unsaved changes will be replaced.`))return;state=s.state;oldSave();render();toast('Snapshot restored')}
function weatherHtml(){let w=extra().weather;if(!w)return '<p class="muted">No forecast loaded yet.</p>';return `<div class="weathergrid">${w.time.map((d,i)=>`<div class="weatherday"><b>${esc(d.slice(5))}</b><span>${w.min[i]}–${w.max[i]}°C</span><small>${w.rain[i]} mm rain</small>${w.min[i]<=2?'<strong>⚠ Cold night</strong>':''}</div>`).join('')}</div><p class="muted">Last fetched: ${esc(extra().weatherTime)}. Check local conditions before planting.</p>`}
async function loadWeather(){let [lat,lon]=$('weatherLocation').value.split(',');$('weatherResult').textContent='Loading forecast…';try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_min,temperature_2m_max,precipitation_sum&timezone=Europe%2FLondon&forecast_days=7`);if(!r.ok)throw Error('Weather service unavailable');let j=await r.json();extra().weather={time:j.daily.time,min:j.daily.temperature_2m_min,max:j.daily.temperature_2m_max,rain:j.daily.precipitation_sum};extra().weatherTime=new Date().toLocaleString('en-GB');save();$('weatherResult').innerHTML=weatherHtml()}catch(e){$('weatherResult').textContent='Could not load forecast. Check your connection and try again.'}}
const originalGo=go;go=function(next){if(++saveCount%8===0)snapshot();originalGo(next);if(next==='beds')renderDesigner()};
init=function(){oldInit()};

/* V4 additions: backwards-compatible, no remote account or paid APIs. */
TABS.splice(4,0,['planner','🧠 Planner'],['rotation','🔄 Rotation'],['care','🩺 Plant care']);
TABS.splice(TABS.length-1,0,['reports','🖨 Reports'],['finance','💷 Expenses']);
const v4=()=>{state.v4=state.v4||{};for(const k of ['succession','plantings','expenses','savedSeeds','perennial','layouts','careNotes'])state.v4[k] ||= (k==='layouts'?{}:[]);return state.v4};
const cropFamily=n=>{n=(n||'').toLowerCase();if(/potato|tomato|pepper|aubergine/.test(n))return 'Nightshade';if(/cabbage|broccoli|kale|cauliflower|sprout|turnip|radish|swede|pak choi/.test(n))return 'Brassica';if(/pea|bean|lentil/.test(n))return 'Legume';if(/carrot|parsnip|celery|parsley/.test(n))return 'Apiaceae';if(/onion|garlic|leek|shallot|chive/.test(n))return 'Allium';if(/squash|courgette|pumpkin|cucumber|melon/.test(n))return 'Cucurbit';return 'Other'};
const opts=(list,sel)=>list.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.label)}</option>`).join('');
const plantOpts=()=>state.growing.map(g=>({id:g.id,label:plantName(g.plantId)}));
const bedOpts=()=>state.beds.map(b=>({id:b.id,label:b.name}));
const fullRender=render;
render=function(){if(['planner','rotation','care','reports','finance'].includes(tab)){$('nav').innerHTML=TABS.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');$('app').innerHTML=({planner:renderPlanner,rotation:renderRotation,care:renderCare,reports:renderReports,finance:renderFinance})[tab]();return}fullRender()};
function renderPlanner(){let v=v4();return `<h2>🧠 Smart growing planner</h2><p class="muted">Bed capacity is an estimate for square planting; row layouts, paths and plant habits change actual capacity.</p><div class="card"><h3>Planting calculator</h3><div class="fields"><label>Bed<select id="calcBed" onchange="calculateSpace()">${opts(bedOpts())}</select></label><label>Growing variety<select id="calcPlant" onchange="calculateSpace()">${opts(plantOpts())}</select></label></div><div id="calcResult"></div><button class="secondary" onclick="calculateSpace()">Calculate capacity</button></div><div class="card"><h3>Succession sowing schedule</h3><form onsubmit="addSuccession(event)"><div class="fields"><label>Plant<select name="growId" required>${opts(plantOpts())}</select></label><label>First sowing<input name="start" type="date" value="${today()}" required></label><label>Interval (days)<input name="interval" type="number" min="7" max="90" value="21" required></label><label>Number of batches<input name="batches" type="number" min="1" max="20" value="4" required></label></div><button>Build sowing schedule</button></form>${v.succession.map(x=>`<details class="fold"><summary>${esc(plantName(state.growing.find(g=>g.id===x.growId)?.plantId))} — ${x.dates.length} sowings</summary>${x.dates.map(d=>`<div class="list-item">🌱 ${esc(d)}</div>`).join('')}<button class="danger" onclick="removeV4('succession','${x.id}')">Remove</button></details>`).join('')}</div><div class="card"><h3>Seed-to-harvest planting log</h3><form onsubmit="addPlanting(event)"><div class="fields"><label>Plant<select name="growId" required>${opts(plantOpts())}</select></label><label>Bed<select name="bedId"><option value="">Not assigned</option>${opts(bedOpts())}</select></label><label>Stage<select name="stage"><option>Sown</option><option>Germinated</option><option>Transplanted</option><option>Growing</option><option>Harvested</option></select></label><label>Date<input name="date" type="date" value="${today()}" required></label></div><button>Record stage</button></form>${v.plantings.slice().reverse().map(x=>`<div class="list-item">${esc(x.date)} · ${esc(plantName(state.growing.find(g=>g.id===x.growId)?.plantId))} · ${esc(x.stage)} <button class="danger" onclick="removeV4('plantings','${x.id}')">×</button></div>`).join('')}</div>`}
function calculateSpace(){let b=getBed($('calcBed')?.value),g=state.growing.find(x=>x.id===$('calcPlant')?.value),p=g&&getPlant(g.plantId),e=$('calcResult');if(!e)return;if(!b||!p){e.innerHTML='<p class="muted">Add a bed and a plant to My Growing first.</p>';return}let area=Number(b.length)*Number(b.width),spacing=Number(p.spacing);e.innerHTML=area>0&&spacing>0?`<p><b>${Math.floor(area/(spacing/100)**2)} plants (theoretical maximum)</b> · ${area.toFixed(1)} m² · ${spacing} cm spacing. Allow extra room for access, growth habit and crop-specific row spacing.</p>`:'<p class="muted">Add valid bed dimensions and plant spacing first.</p>'}
function addSuccession(e){e.preventDefault();let f=new FormData(e.target),start=new Date(f.get('start')+'T12:00:00'),days=Number(f.get('interval')),n=Number(f.get('batches')),dates=Array.from({length:n},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i*days);return dateISO(d)});v4().succession.push({id:uid(),growId:f.get('growId'),dates});save();render()}
function addPlanting(e){e.preventDefault();v4().plantings.push({id:uid(),...Object.fromEntries(new FormData(e.target))});save();render()}
function removeV4(key,id){v4()[key]=v4()[key].filter(x=>x.id!==id);save();render()}
function renderRotation(){let v=v4();return `<h2>🔄 Crop rotation & bed maps</h2><p class="muted">Crop-family warnings are planning guidance, not absolute rules. Keep records of actual plantings for meaningful rotation history.</p>${state.beds.map(b=>{let occupants=state.growing.filter(g=>g.bedId===b.id).map(g=>getPlant(g.plantId)).filter(Boolean),history=state.bedHistory.filter(h=>h.bedId===b.id),last=history.filter(h=>Number(h.year)>=new Date().getFullYear()-3),warnings=occupants.flatMap(p=>last.filter(h=>cropFamily(h.crop)===cropFamily(p.name)&&cropFamily(p.name)!=='Other').map(h=>`${p.name} and ${h.crop} share the ${cropFamily(p.name)} family (${h.year})`));return `<div class="card"><h3>${esc(b.name)} · ${esc(b.length)} × ${esc(b.width)} m</h3><p>${occupants.map(p=>`<span class="tag">${esc(p.name)} (${cropFamily(p.name)})</span>`).join(' ')||'No assigned crops'}</p>${warnings.length?`<p class="note">⚠ ${esc([...new Set(warnings)].join('; '))}. Consider rotating if practical.</p>`:'<p class="muted">No matching recent crop-family history flagged.</p>'}<h4>Custom bed grid</h4><label>Columns <input type="number" min="2" max="12" id="cols-${b.id}" value="${v.layouts[b.id]?.cols||4}"></label><label>Rows <input type="number" min="2" max="12" id="rows-${b.id}" value="${v.layouts[b.id]?.rows||4}"></label><button class="secondary" onclick="setLayout('${b.id}')">Set grid</button><div class="v4grid" style="grid-template-columns:repeat(${v.layouts[b.id]?.cols||4},minmax(0,1fr))">${Array.from({length:(v.layouts[b.id]?.cols||4)*(v.layouts[b.id]?.rows||4)},(_,i)=>`<button onclick="editV4Cell('${b.id}',${i})">${v.layouts[b.id]?.cells?.[i]?esc(plantName(v.layouts[b.id].cells[i])):'＋'}</button>`).join('')}</div></div>`}).join('')||'<div class="card">Create beds first in the Beds tab.</div>'}`}
function setLayout(id){let cols=Math.max(2,Math.min(12,Number($('cols-'+id).value)||4)),rows=Math.max(2,Math.min(12,Number($('rows-'+id).value)||4)),old=v4().layouts[id]||{};v4().layouts[id]={cols,rows,cells:old.cells||{}};save();render()}
function editV4Cell(id,i){let layout=v4().layouts[id]||{cols:4,rows:4,cells:{}};openModal(`<h3>Assign bed position</h3><label>Plant<select id="v4CellPlant"><option value="">Empty</option>${state.growing.map(g=>`<option value="${esc(g.plantId)}" ${layout.cells?.[i]===g.plantId?'selected':''}>${esc(plantName(g.plantId))}</option>`).join('')}</select></label><button onclick="saveV4Cell('${id}',${i})">Save position</button>`)}
function saveV4Cell(id,i){let x=v4().layouts[id]||{cols:4,rows:4,cells:{}};x.cells||={};let p=$('v4CellPlant').value;if(p)x.cells[i]=p;else delete x.cells[i];v4().layouts[id]=x;save();closeModal();render()}
const symptoms={'Yellow leaves':'Possible causes include overwatering, nutrient shortage, natural ageing or cold. Check soil moisture, recent feeding and which leaves are affected.','Holes in leaves':'Inspect undersides of leaves and check for slugs, snails or caterpillars. Use physical protection and identify the pest before treating.','Wilting':'Check root-zone moisture, drainage, heat and root damage. Both dry and waterlogged soil can cause wilting.','Poor fruit set':'Consider low pollinator activity, temperature extremes, uneven watering and insufficient light.','White coating':'Could be powdery mildew or a harmless residue. Inspect pattern and weather; improve airflow and confirm identification.','Brown leaf edges':'Could be drought, salt accumulation, wind scorch or frost damage. Check growing conditions.'};
function renderCare(){let v=v4();return `<h2>🩺 Plant health & companion guidance</h2><div class="card"><h3>Problem solver</h3><label>What are you seeing?<select id="symptom" onchange="showSymptom()">${Object.keys(symptoms).map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><div id="symptomResult" class="note">${esc(symptoms[Object.keys(symptoms)[0]])}</div><p class="muted">Possible explanations only, not a diagnosis. Consult RHS guidance if symptoms persist.</p></div><div class="card"><h3>Companion planting for your crops</h3>${state.growing.map(g=>{let p=getPlant(g.plantId);return p?`<details class="fold"><summary>${esc(p.name)} — ${esc(p.variety)}</summary><p><b>Suggested neighbours:</b> ${esc((p.companions||[]).join(', ')||'No suggestions recorded')}</p><p><b>Potential conflicts:</b> ${esc((p.avoid||[]).join(', ')||'None recorded')}</p><p class="muted">Traditional associations are not proven pest-control guarantees. Prioritise spacing, light and watering needs.</p></details>`:''}).join('')||'<p class="muted">Add plants to My Growing first.</p>'}</div><div class="card"><h3>Perennial care reminders</h3><form onsubmit="addV4Item(event,'perennial')"><input name="title" placeholder="e.g. Prune blackcurrants" required><input name="date" type="date" value="${today()}" required><button>Add reminder</button></form>${v.perennial.map(x=>`<div class="list-item"><label><input type="checkbox" ${x.done?'checked':''} onchange="toggleV4('perennial','${x.id}',this.checked)"> ${esc(x.title)} · ${esc(x.date)}</label><button class="danger" onclick="removeV4('perennial','${x.id}')">×</button></div>`).join('')}</div><div class="card"><h3>Seed saving records</h3><form onsubmit="addV4Item(event,'savedSeeds')"><input name="title" placeholder="Variety and seed lot" required><input name="date" type="date" value="${today()}" required><button>Save seed lot</button></form>${v.savedSeeds.map(x=>`<div class="list-item">${esc(x.title)} · ${esc(x.date)} <button class="danger" onclick="removeV4('savedSeeds','${x.id}')">×</button></div>`).join('')}</div>`}
function showSymptom(){$('symptomResult').textContent=symptoms[$('symptom').value]}
function addV4Item(e,key){e.preventDefault();v4()[key].push({id:uid(),...Object.fromEntries(new FormData(e.target)),done:false});save();render()}
function toggleV4(key,id,val){let x=v4()[key].find(x=>x.id===id);if(x)x.done=val;save();render()}
function renderFinance(){let v=v4(),total=v.expenses.reduce((a,x)=>a+Number(x.amount||0),0);return `<h2>💷 Allotment expenses</h2><div class="card"><h3>Total recorded: £${total.toFixed(2)}</h3><form onsubmit="addV4Item(event,'expenses')"><div class="fields"><label>Item<input name="title" required placeholder="Compost, seeds…"></label><label>Cost (£)<input name="amount" type="number" min="0" step="0.01" required></label><label>Date<input name="date" type="date" value="${today()}" required></label></div><button>Add expense</button></form>${v.expenses.map(x=>`<div class="list-item">${esc(x.date)} · ${esc(x.title)} · £${Number(x.amount).toFixed(2)} <button class="danger" onclick="removeV4('expenses','${x.id}')">×</button></div>`).join('')}</div>`}
function renderReports(){return `<h2>🖨 Print allotment reports</h2><div class="card"><p>Print your growing list, bed assignments, tasks, seed inventory, harvest records and planting schedule. On Android, choose <b>Save as PDF</b> from the print dialog.</p><button onclick="printReport()">Create printable report / PDF</button></div><div class="card"><h3>Data safety</h3><p>V4 retains the V3 storage key and original records. Export a JSON backup in Settings before updating. Local photos and records are not synced across devices.</p><button onclick="go('settings')">Go to backups</button></div>`}
function printReport(){let v=v4(),body=`<h1>My Allotment Planner — ${today()}</h1><h2>Growing list</h2><ul>${state.growing.map(g=>`<li>${esc(plantName(g.plantId))} — ${esc(g.status)} — ${esc(getBed(g.bedId)?.name||'Unassigned')}</li>`).join('')}</ul><h2>Beds</h2>${state.beds.map(b=>`<p>${esc(b.name)}: ${esc(b.length)} × ${esc(b.width)} m</p>`).join('')}<h2>Tasks</h2><ul>${state.tasks.map(x=>`<li>${esc(x.date)} — ${esc(x.title)} ${x.done?'✓':''}</li>`).join('')}</ul><h2>Seeds</h2><ul>${state.seeds.map(x=>`<li>${esc(x.title)} — ${esc(x.amount)}</li>`).join('')}</ul><h2>Harvests</h2><ul>${state.harvest.map(x=>`<li>${esc(x.date)} — ${esc(x.title)} — ${esc(x.amount)}</li>`).join('')}</ul><h2>Succession schedule</h2>${v.succession.map(x=>`<p>${esc(plantName(state.growing.find(g=>g.id===x.growId)?.plantId))}: ${x.dates.join(', ')}</p>`).join('')}`;let w=window.open('','_blank');if(!w){toast('Allow popups to print');return}w.document.write('<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Allotment report</title><style>body{font:15px system-ui;margin:28px;color:#183b2a}h1,h2{color:#215c3d}li{margin:6px 0}@media print{button{display:none}}</style></head><body>'+body+'<button onclick="print()">Print / Save PDF</button></body></html>');w.document.close()}
const previousHome=renderHome;renderHome=function(){return previousHome()+`<div class="card"><h3>⚡ Quick actions</h3><div class="actions"><button onclick="go('planner')">🌱 Record planting</button><button onclick="go('harvest')">🧺 Record harvest</button><button onclick="go('tasks')">☑ Tick off tasks</button><button onclick="go('rotation')">▦ Bed designer</button></div></div>`};
const previousCalendar=renderCalendar;renderCalendar=function(){let s=v4().succession.flatMap(x=>x.dates.map(d=>({date:d,name:plantName(state.growing.find(g=>g.id===x.growId)?.plantId)}))).filter(x=>x.date.slice(0,7)===`${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,'0')}`);return previousCalendar()+`<div class="card"><h3>Scheduled succession sowings this month</h3>${s.map(x=>`<div class="list-item">${esc(x.date)} · ${esc(x.name)}</div>`).join('')||'<p class="muted">No succession batches planned this month.</p>'}</div>`};
const previousSettings=renderSettings;renderSettings=function(){return previousSettings()+`<div class="card"><h3>V4 compatibility</h3><p>All V4 records are stored alongside your V3 records under the same browser storage key. Export JSON backups regularly. Internet lookup and weather require a connection; reminders are in-app only.</p></div>`};

init();
</script></body></html>
